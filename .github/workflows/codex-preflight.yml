name: Codex fork preflight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Contribution branch or commit SHA to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run diff-aware lint
        run: |
          git fetch origin main --depth=1
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0 run --new-from-rev=origin/main

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check out Vetu
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/vetu
          path: _vetu
      - name: Build Vetu
        working-directory: _vetu
        run: |
          go build -o "$RUNNER_TEMP/vetu" cmd/vetu/main.go
          sudo setcap cap_net_raw,cap_net_admin+eip "$RUNNER_TEMP/vetu"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Cloud Hypervisor
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/cloud-hypervisor" \
            https://github.com/cloud-hypervisor/cloud-hypervisor/releases/latest/download/cloud-hypervisor-static
          chmod +x "$RUNNER_TEMP/cloud-hypervisor"
      - name: Enable KVM access
        run: sudo chmod 0666 /dev/kvm
      - name: Pre-pull default Vetu image
        run: vetu pull ghcr.io/cirruslabs/ubuntu-amd64:24.04
      - name: Run tests
        run: go test -timeout=30m -v -count=1 ./...

  test-macos:
    name: Test (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go list ./... | grep -v '/internal/tests' | xargs go test -timeout=20m -ldflags="-B gobuildid" -v -count=1
